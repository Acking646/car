[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complexity-aware-routing"
version = "0.1.0"
description = "Complexity-Aware Routing for efficient Mixture-of-Experts language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Jiahe Li"},
  {name = "Saisai Hu"},
  {name = "Menghao Li"},
  {name = "Shaolin Zhu"},
  {name = "Deyi Xiong"}
]
dependencies = [
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "numpy>=1.26,<3",
  "safetensors>=0.4,<1",
  "torch>=2.4,<3",
  "tqdm>=4.66,<5",
  "transformers>=4.51,<5"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
